<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anastasiia Krasovska Course</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f7f3;color:#172c37}
.b{max-width:420px;margin:18vh auto;padding:24px;text-align:center}
.t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#176957}
.s{width:38px;height:38px;border:4px solid #e6f2ec;border-top-color:#176957;border-radius:50%;margin:18px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="b"><div class="t">Anastasiia Krasovska Course</div><div class="s"></div><p id="m">Загрузка курса…</p></div>
<script>
/* Loader: the course itself and all student data live in the teacher's private Google Drive.
   This page only fetches the course from the Google Apps Script web app (no Google login needed). */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyAwgCPAS_C1x9xb-EtQDrsQYA09-cqYq6ylH4vc-rdnbsFQN7xwwvU6MicUX3e5fju_w/exec';
  function fail() { document.getElementById('m').innerHTML = 'Не удалось загрузить курс. Проверьте интернет и обновите страницу.'; }
  fetch(API, { method: 'POST', credentials: 'omit', body: JSON.stringify({ action: 'page' }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (!d || !d.ok || !d.html) throw new Error('empty'); document.open(); document.write(d.html); document.close(); })
    .catch(fail);
})();
</script>
</body>
</html>
